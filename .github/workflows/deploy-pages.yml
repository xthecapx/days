name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    # The interface is only republished when something it uses changes. The help signal server
    # (services/signal) is deployed on its own. NOTE: `data/**` must stay here; it is what changes when a
    # neighbour report (Pull Request) is approved, and it has to be published.
    paths:
      - "src/**"
      - "index.html"
      - "public/**"
      - "data/**"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite bundles index.html and src/ and copies data/ as is; the Worker, the scripts, the tests and the
      # CI stay out.
      - name: Build site
        run: npm run build

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
