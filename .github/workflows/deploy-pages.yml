name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    # Solo se vuelve a publicar la interfaz cuando cambia algo que ella usa. El servidor de la señal de ayuda
    # (services/signal) se despliega por su cuenta. OJO: `data/**` debe seguir aquí; es lo que cambia cuando se
    # aprueba un reporte vecinal (Pull Request) y tiene que publicarse.
    paths:
      - "src/**"
      - "index.html"
      - "public/**"
      - "data/**"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite empaqueta index.html y src/ y copia data/ tal cual; el Worker, los scripts, las pruebas y el
      # CI se quedan fuera.
      - name: Build site
        run: npm run build

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
